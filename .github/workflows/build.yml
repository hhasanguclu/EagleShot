name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add ${{ matrix.target }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: ./scripts/linux-build-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --release --locked --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Test
        # x86_64 macOS binaries run under Rosetta on the arm64 runner
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a -s "-screen 0 1280x800x24" ./scripts/smoke-test.sh target/${{ matrix.target }}/release/eagleshot

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: EagleShot-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/eagleshot
            target/${{ matrix.target }}/release/eagleshot.exe
