name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add ${{ matrix.target }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: ./scripts/linux-build-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --release --locked --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Test
        # x86_64 macOS binaries run under Rosetta on the arm64 runner
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Linux UI smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a -s "-screen 0 1280x800x24" ./scripts/smoke-test.sh target/${{ matrix.target }}/release/eagleshot

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe target/${{ matrix.target }}/release/eagleshot.exe

      - name: macOS smoke test
        if: runner.os == 'macOS'
        run: |
          EXE=target/${{ matrix.target }}/release/eagleshot
          export EAGLESHOT_CONFIG_DIR="$RUNNER_TEMP/eagleshot" EAGLESHOT_PORT=47557
          mkdir -p "$EAGLESHOT_CONFIG_DIR"
          echo '{ "ShowSplash": false }' > "$EAGLESHOT_CONFIG_DIR/settings.json"
          $EXE --version
          $EXE --minimized > "$RUNNER_TEMP/eagleshot.log" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 $PID 2>/dev/null; then echo "EagleShot exited early:"; cat "$RUNNER_TEMP/eagleshot.log"; exit 1; fi
          $EXE --quit
          for i in $(seq 1 30); do kill -0 $PID 2>/dev/null || break; sleep 0.5; done
          if kill -0 $PID 2>/dev/null; then echo "EagleShot did not quit"; cat "$RUNNER_TEMP/eagleshot.log"; kill $PID; exit 1; fi
          echo "smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: EagleShot-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/eagleshot
            target/${{ matrix.target }}/release/eagleshot.exe
