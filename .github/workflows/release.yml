name: Release

# Releases are made by pushing a v* tag, by running the workflow manually,
# or by pushing a commit whose message contains "[release]" (the tag is then
# created from the version in Cargo.toml).
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle ffmpeg and Tesseract
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force publish/win-x64 | Out-Null
          Copy-Item target/release/eagleshot.exe publish/win-x64/EagleShot.exe
          ./scripts/fetch-windows-tools.ps1 -Destination publish/win-x64/tools

      - name: Smoke test
        shell: pwsh
        run: |
          & publish/win-x64/EagleShot.exe --version | Out-Host
          $p = Start-Process publish/win-x64/EagleShot.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "EagleShot exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md, LICENSE -Destination publish/win-x64/ -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/EagleShot_v${version}_win-x64.zip"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$version" "/DProjectDir=$env:GITHUB_WORKSPACE" installers/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: prepare
    # Ubuntu 22.04 keeps the binary compatible with older glibc versions.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: ./scripts/linux-build-deps.sh
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a -s "-screen 0 1280x800x24" ./scripts/smoke-test.sh target/release/eagleshot

      - name: Package
        run: |
          VERSION="${TAG#v}"
          NAME="EagleShot_v${VERSION}_linux-x64"
          mkdir -p "dist" "staging/$NAME/publish/linux-x64/Resources" "staging/$NAME/installers/linux"
          cp target/release/eagleshot "staging/$NAME/publish/linux-x64/EagleShot"
          cp Resources/logo.png "staging/$NAME/publish/linux-x64/Resources/"
          cp installers/linux/*.sh "staging/$NAME/installers/linux/"
          cp README.md "staging/$NAME/"
          chmod +x "staging/$NAME/installers/linux/"*.sh "staging/$NAME/publish/linux-x64/EagleShot"
          tar -C staging -czf "dist/$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target $T
          done
          mkdir -p publish/osx-arm64 publish/osx-x64
          cp target/aarch64-apple-darwin/release/eagleshot publish/osx-arm64/EagleShot
          cp target/x86_64-apple-darwin/release/eagleshot publish/osx-x64/EagleShot

      - name: Create .app and .dmg
        run: |
          export VERSION="${TAG#v}"
          chmod +x installers/macos/create-app.sh
          ./installers/macos/create-app.sh
          ls -l dist

      - name: Smoke test (Apple Silicon)
        run: |
          # Mount the DMG like a user would and make sure the app starts and stays up.
          VERSION="${TAG#v}"
          hdiutil attach "dist/EagleShot_v${VERSION}_osx-arm64.dmg" -mountpoint /tmp/eagleshot -nobrowse
          codesign --verify --deep --strict --verbose=2 /tmp/eagleshot/EagleShot.app
          /tmp/eagleshot/EagleShot.app/Contents/MacOS/EagleShot --version
          /tmp/eagleshot/EagleShot.app/Contents/MacOS/EagleShot --minimized > /tmp/eagleshot.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then
            echo "EagleShot exited early:"; cat /tmp/eagleshot.log; exit 1
          fi
          kill $PID || true
          hdiutil detach /tmp/eagleshot

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: EagleShot ${{ env.TAG }} 🦅
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: artifacts/*
